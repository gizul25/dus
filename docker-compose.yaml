name: dus

services:
  database:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017
  frontend:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/frontend
    command: ./dev.sh
    ports:
      - 5173:5173
  backend:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/backend
    command: ./dev-backend.sh
    ports:
      - 8000:8000
    environment:
     JWT_SECRET: tDfPmnb4Cb-EDjp0kk7QEgj7MwbcjliScxwM-QV1R-c
  ws:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/backend
    command: ./dev-ws.sh
    ports:
      - 7000:7000
  nginx:
    image: nginx
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:8080
  kafka:
    build: infra/dev
    volumes:
      - ./:/app
    command: ./infra/kafka/dev.sh
    ports:
      - 9092:9092

