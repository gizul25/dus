name: dus

services:
  database:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - database-data:/data/db
    ports:
      - 27017:27017
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "root",
          "-p",
          "password",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  frontend:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/frontend
    command: ./dev.sh
    restart: unless-stopped
    ports:
      - 5173:5173
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  backend:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/backend
    command: ./dev-backend.sh
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://root:password@database:27017/
      DBNAME: appdb
      JWT_SECRET: tDfPmnb4Cb-EDjp0kk7QEgj7MwbcjliScxwM-QV1R-c
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  ws:
    build: infra/dev
    volumes:
      - ./:/app
    working_dir: /app/backend
    command: ./dev-ws.sh
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 7000:7000
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:1.28
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:8080
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ws:
        condition: service_healthy
  kafka:
    build: infra/dev
    volumes:
      - ./:/app
      - kafka-data:/home/user/kafka_2.13-4.3.1/data
    command: ./infra/kafka/dev.sh
    restart: unless-stopped
    ports:
      - 9092:9092
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "/home/user/kafka_2.13-4.3.1/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    ports:
      - 1883:1883
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-h",
          "localhost",
          "-p",
          "1883",
          "-t",
          "$SYS/broker/version",
          "-C",
          "1",
          "-W",
          "5",
        ]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 10s

volumes:
  database-data:
  kafka-data:
  mqtt-data:
