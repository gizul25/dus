apiVersion: v1
kind: Service
metadata:
  name: websocket
  labels:
    app.kubernetes.io/name: websocket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: websocket
  ports:
    - name: http
      port: 7000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  labels:
    app.kubernetes.io/name: websocket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-kafka-topics
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                sleep 2
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic websocket-messages-client --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic websocket-messages-server --partitions 1 --replication-factor 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: websocket
          image: dus-backend:local
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend/app
          command:
            - uvicorn
          args:
            - ws:ws_app
            - --host
            - 0.0.0.0
            - --port
            - "7000"
            - --ws
            - websockets-sansio
          ports:
            - name: http
              containerPort: 7000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
